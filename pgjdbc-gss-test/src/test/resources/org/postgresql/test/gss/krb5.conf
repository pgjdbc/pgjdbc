# Client configuration for the KDC of the gss profile in docker/postgres-server.
# udp_preference_limit = 1 sends every request over TCP, the only protocol the
# compose file publishes. The keytab holds postgres/localhost, so the host name
# must not be canonicalized into, say, localhost.localdomain.
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_kdc = false
    dns_lookup_realm = false
    dns_canonicalize_hostname = false
    rdns = false
    udp_preference_limit = 1

[realms]
    EXAMPLE.COM = {
        kdc = 127.0.0.1:88
    }

[domain_realm]
    localhost = EXAMPLE.COM
