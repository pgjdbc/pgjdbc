name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
        default: ''
        description: Release version number (without v, defaults to gradle.properties)

jobs:
  check-changelog:
    name: Check that master has the changelog of the release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate input parameters
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # language=bash
        run: |
          # Ensure we release from master or release/** branches, ensure version number follows semver
          BRANCH_NAME=${GITHUB_REF##refs/heads/}
          if [[ ! "$BRANCH_NAME" =~ ^(master|release/.+)$ ]]; then
            echo "Error: Release must be created from 'master' or 'release/**' branch. Current branch is '$BRANCH_NAME'"
            exit 1
          fi

          # Validate version follows semver or is empty
          VERSION="$INPUT_VERSION"
          if [[ -n "$VERSION" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be blank or follow semantic versioning format (x.y.z). Got '$VERSION'"
            exit 1
          fi

      - name: Get the release version
        id: release_version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        # language=bash
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
            SOURCE="the workflow input"
          else
            VERSION=$(grep "^pgjdbc.version=" gradle.properties | cut -d'=' -f2)
            SOURCE="pgjdbc.version in gradle.properties"
          fi
          # Later steps put the version into file names, git commands and
          # the Hugo build, so it must be three numbers separated by dots.
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release version from $SOURCE is '$VERSION'," \
              "which is not three numbers separated by dots"
            exit 1
          fi
          echo "Got release version from $SOURCE: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout the docs of master
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          path: master
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/
            /.github/workflows/docs.yml

      # Only master's docs.yml pins the Hugo version, and Renovate updates
      # master only, so a release branch reads the pin from there. The pin
      # must be a version number such as 0.167.0, not 'latest', so that the
      # check builds with the Hugo that the deploy uses.
      - name: Read the Hugo version from master
        id: hugo
        # language=bash
        run: |
          # The pin may be in single quotes, in double quotes or bare.
          q="'([^']*)'|\"([^\"]*)\"|([^'\" #]*)"
          v=$(sed -n -E "s/^ *hugo-version: *($q) *(#.*)?\$/\\2\\3\\4/p" \
            master/.github/workflows/docs.yml)
          if [[ -z $v ]]; then
            echo "::error::master's .github/workflows/docs.yml has no" \
              "hugo-version line"
            exit 1
          fi
          if [[ ! $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::master's .github/workflows/docs.yml sets" \
              "hugo-version to '$v', which is not a version number such as" \
              "0.167.0"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: ${{ steps.hugo.outputs.version }}
          extended: true

      # The deploy builds master's docs/, so the release version must have a
      # changelog there. Invariant I6 in docs/layouts/partials/releases.html
      # fails the build when no changelog sets HUGO_PARAMS_RELEASEVERSION.
      - name: Build the docs of master with the release version
        env:
          HUGO_PARAMS_RELEASEVERSION: >-
            ${{ steps.release_version.outputs.version }}
        # language=bash
        run: |
          if ! hugo --minify -s master/docs -d "$RUNNER_TEMP/site"; then
            v=$HUGO_PARAMS_RELEASEVERSION
            echo "::error::master's docs/ does not build with" \
              "HUGO_PARAMS_RELEASEVERSION=$v. If the Hugo error above says" \
              "that no changelog sets version $v, merge the changelog for" \
              "$v to master and start the release again."
            exit 1
          fi

  publish-release:
    name: Publish release
    needs: check-changelog
    runs-on: ubuntu-latest
    permissions:
      # write permission is required to create a GitHub release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: read
      # write permission is required to start the website deploy
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check if tag exists
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.check-changelog.outputs.version }}
        with:
          # language=javascript
          script: |
             const tag = `REL${process.env.VERSION}`;
             // Check if the tag exists
             const { data: tags } = await github.rest.git.listMatchingRefs({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 ref: `tags/${tag}`
             });
             if (tags.length > 0) {
                 core.setFailed(`Tag ${tag} already exists. Bump version in gradle.properties and try releasing again.`);
             }

      - name: Prepare git name and email
        # language=bash
        run: |
          # Configure git user.name and user.email
          # See https://github.com/actions/checkout?tab=readme-ov-file#push-a-commit-using-the-built-in-token
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app_token
        with:
          app-id: ${{ vars.GH_BUMP_VERSION_APP_ID }}
          private-key: ${{ secrets.GH_BUMP_VERSION_APP_KEY }}

      - name: >-
          Update version in gradle.properties to
          ${{ needs.check-changelog.outputs.version }}
        uses: ./.github/actions/update_version
        with:
          token: ${{ steps.app_token.outputs.token }}
          version: ${{ needs.check-changelog.outputs.version }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21
          server-id: central

      # Publish to Central before generating a tag, so we don't need to drop the tag if
      # Central deployment fails.
      # publishAllPublicationsToTmp-mavenRepository stages the signed artifacts under
      # pgjdbc/build/local-maven-repo in the same Gradle run, so the jar and signature attached to
      # the GitHub release below are byte-for-byte the ones uploaded to Central.
      - name: Publish to Central Portal
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3
        with:
          arguments: publishAggregationToCentralPortal :postgresql:publishAllPublicationsToTmp-mavenRepository
          # language=properties
          properties: |
            release=true
            centralPortalPublishingType=AUTOMATIC
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          SIGNING_PGP_PRIVATE_KEY: ${{ secrets.RELEASE_PGP_PRIVATE_KEY }}
          SIGNING_PGP_PASSPHRASE: ${{ secrets.RELEASE_PGP_PASSPHRASE }}

      - name: Publish GitHub release
        uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        id: publish_release
        with:
          disable-autolabeler: true
          publish: true
          latest: ${{ github.ref_name == github.event.repository.default_branch }}
          version: ${{ needs.check-changelog.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Must run after "Publish GitHub release" (the release has to exist) and before the version
      # bump below, whose push triggers release-drafter for the next version's draft.
      - name: Attach files to the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # https://github.com/release-drafter/release-drafter#action-outputs
          RELEASE_ID: ${{ steps.publish_release.outputs.id }}
          VERSION: ${{ needs.check-changelog.outputs.version }}
        with:
          # language=JavaScript
          script: |
            const fs = require('fs');
            const {RELEASE_ID, VERSION} = process.env;
            // The jar and its detached PGP signature staged by the publish step. Paths are fixed,
            // so a missing file means the publish step failed to produce it.
            const artifactDir = `pgjdbc/build/local-maven-repo/org/postgresql/postgresql/${VERSION}`;
            const artifactName = `postgresql-${VERSION}.jar`;
            const uploadFiles = [
                [artifactName, `${artifactDir}/${artifactName}`],
                [`${artifactName}.asc`, `${artifactDir}/${artifactName}.asc`],
            ];
            for (const [name, filePath] of uploadFiles) {
                if (!fs.existsSync(filePath)) {
                    core.setFailed(`Release artifact ${name} not found at ${filePath}. Check that the publish step ran publishAllPublicationsToTmp-mavenRepository.`);
                    return;
                }
            }
            // Drop any stale jar/signature assets (e.g. a SNAPSHOT jar carried over on an older
            // draft) before re-uploading. This assumes the release ships exactly uploadFiles; widen
            // the filter if more jars are ever attached.
            const assets = await github.rest.repos.listReleaseAssets({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: RELEASE_ID
            });
            for (const asset of assets.data) {
                if (asset.name.endsWith('.jar') || asset.name.endsWith('.jar.asc')) {
                    core.info(`Deleting stale release asset ${asset.name}`);
                    await github.rest.repos.deleteReleaseAsset({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        asset_id: asset.id
                    });
                }
            }
            for (const [name, filePath] of uploadFiles) {
                core.info(`Uploading ${name} from ${filePath}`);
                await github.rest.repos.uploadReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name,
                    release_id: RELEASE_ID,
                    data: fs.readFileSync(filePath)
                });
            }

      - name: Compute the next patch version
        id: next_version
        env:
          RELEASE_VERSION: ${{ needs.check-changelog.outputs.version }}
        # language=bash
        run: |
          # Compute the next patch version
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          next_version="${major}.${minor}.$((patch + 1))"
          echo "Next version: $next_version"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Update version in gradle.properties to ${{ steps.next_version.outputs.version }}
        uses: ./.github/actions/update_version
        with:
          token: ${{ steps.app_token.outputs.token }}
          version: ${{ steps.next_version.outputs.version }}

      # A release that release-drafter publishes with GITHUB_TOKEN starts no
      # workflow, but a workflow_dispatch event does. The deploy runs on
      # master, whatever branch this release comes from. The step runs even
      # when an earlier step after the publish failed, because the site
      # needs only the release on Central.
      - name: Start the website deploy
        if: ${{ !cancelled() && steps.publish_release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-changelog.outputs.version }}
        # language=bash
        run: |
          if ! gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" \
            --ref master -f version="$VERSION"; then
            cmd="gh workflow run docs.yml -R $GITHUB_REPOSITORY --ref master"
            echo "::error::The release is published, but the website deploy" \
              "did not start. Run: $cmd -f version=$VERSION"
            exit 1
          fi
