name: Deploy Hugo Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/update_version/**'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          A release version that Maven Central may not list yet, such as
          42.7.15. Its jar is fetched with retries.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('docs-pr-{0}', github.event.pull_request.number)
    || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Setup Pages reads the Pages site through the REST API, which needs
    # pages: read. Pull request runs skip that step.
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: hugo --minify
        working-directory: ./docs

      - name: Test the scripts
        run: docs/scripts/test-site-scripts.sh

      - name: Fetch from Maven Central
        id: fetch
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: docs/scripts/fetch-central.sh docs/public "$RELEASE_VERSION"

      - name: Check the site against Maven Central
        env:
          JAVADOC_VERSION: ${{ steps.fetch.outputs.javadoc-version }}
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'deploy' }}
        run: >-
          docs/scripts/check-site.sh docs/public docs/central-versions.txt
          "$JAVADOC_VERSION" "$MODE"

      - name: Lint the workflows
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/docs.yml .github/workflows/release.yml

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./docs/public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
