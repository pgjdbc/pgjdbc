name: Deploy Hugo Docs

on:
  # release.yml starts this workflow after each release, on the release tag,
  # so the site is built from the released commit. It can also be started by
  # hand on any branch or tag.
  workflow_dispatch:
  # Pull requests that change the site only build it, so a broken build, or a
  # Hugo upgrade that breaks the site, shows up before the merge.
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          # Renovate proposes upgrades of this version. A pinned version keeps
          # a new Hugo release from breaking the deploy on a release day.
          hugo-version: '0.167.0'
          extended: true

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build
        run: hugo --minify
        working-directory: ./docs

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./docs/public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
