---
name: RPM build in Fedora Copr
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Copr build
    runs-on: ubuntu-latest

    steps:
      - name: Check out proper version of sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Submit the build and wait for the result
        # A Copr outage or an outdated @pgjdbc/pgjdbc config must not block merges, so this
        # step tolerates failure. continue-on-error belongs on the step: on the job it still
        # marks the check as failed, see https://github.com/orgs/community/discussions/15452.
        # The check therefore passes either way, and the step prints the failing Copr log
        # into the Actions output.
        continue-on-error: true
        env:
          COPR_PR_WEBHOOK: https://copr.fedorainfracloud.org/webhooks/custom/55296/cf449c12-03b4-4f5b-ae84-3f5aa1d2b462/postgresql-jdbc/
          COPR_PUSH_WEBHOOK: ${{ secrets.COPR_PUSH_WEBHOOK }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash packaging/rpm/setup-copr/submit-copr.sh "$PR_NUMBER"
